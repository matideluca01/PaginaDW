<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="diagBg" width="28" height="28" patternTransform="rotate(135)" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#1D1D1B"/>
      <rect width="14" height="28" fill="#232320"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#diagBg)"/>

  <!-- Workbench -->
  <rect x="60" y="330" width="620" height="16" rx="3" fill="#FEBD11"/>
  <rect x="90" y="346" width="16" height="60" fill="#3A392F"/>
  <rect x="600" y="346" width="16" height="60" fill="#3A392F"/>

  <!-- Angle grinder body on the bench -->
  <g transform="translate(430,240)">
    <rect x="-10" y="0" width="150" height="46" rx="10" fill="none" stroke="#F5F3EC" stroke-width="5"/>
    <rect x="20" y="-38" width="16" height="42" rx="6" fill="none" stroke="#F5F3EC" stroke-width="5"/>
    <path d="M140 20 L200 20" stroke="#F5F3EC" stroke-width="5" stroke-linecap="round"/>
    <path d="M195 -35 A55 55 0 0 1 240 20" fill="none" stroke="#FEBD11" stroke-width="6" stroke-linecap="round"/>
    <circle cx="220" cy="20" r="52" fill="none" stroke="#FEBD11" stroke-width="5"/>
    <circle cx="220" cy="20" r="8" fill="#FEBD11"/>
  </g>

  <!-- Sparks near the disc -->
  <g stroke="#FEBD11" stroke-width="4" stroke-linecap="round">
    <path d="M690 250 L716 232"/>
    <path d="M700 270 L730 268"/>
    <path d="M685 288 L706 306"/>
    <path d="M672 232 L680 208"/>
  </g>
  <circle cx="722" cy="220" r="4" fill="#FEBD11"/>
  <circle cx="736" cy="272" r="3" fill="#FEBD11"/>

  <!-- Technician crouching, working on the grinder -->
  <g stroke="#F5F3EC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="230" cy="150" r="26" fill="none"/>
    <path d="M230 176 L215 250 L200 330"/>
    <path d="M215 250 L260 258 L268 330"/>
    <path d="M222 200 L150 236 L118 300"/>
    <path d="M222 200 L300 224 L360 246"/>
    <path d="M118 300 L96 330"/>
    <path d="M200 330 L170 336"/>
    <path d="M268 330 L300 336"/>
  </g>
  <!-- wrench in hand -->
  <g transform="translate(348,238) rotate(18)" fill="#FEBD11">
    <rect x="0" y="-6" width="70" height="12" rx="4"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#FEBD11" stroke-width="8"/>
  </g>

  <!-- Toolbox beside the bench -->
  <g transform="translate(590,290)">
    <rect x="0" y="0" width="80" height="46" rx="4" fill="none" stroke="#8A8A7F" stroke-width="4"/>
    <path d="M18 0 L18 -16 L62 -16 L62 0" fill="none" stroke="#8A8A7F" stroke-width="4"/>
    <line x1="0" y1="18" x2="80" y2="18" stroke="#8A8A7F" stroke-width="3"/>
  </g>
</svg>
